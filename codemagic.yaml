workflows:
  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.tamerlan.nearby
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npx cap sync ios
      - name: Set up keychain
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App --archive-xcargs "CODE_SIGN_STYLE=Automatic"
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
