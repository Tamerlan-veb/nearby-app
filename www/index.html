<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Рядом — магазины и метро</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="manifest" href='data:application/manifest+json,{"name":"Рядом","short_name":"Рядом","start_url":".","display":"standalone","background_color":"#0b1220","theme_color":"#2563eb"}'>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#ef4444;--chip:#fff;--chip-border:#cbd5e1;--input:#fff;--shadow:0 4px 12px rgba(37,99,235,.25)}
body.dark{--bg:#0b1220;--panel:#111a2b;--text:#e2e8f0;--muted:#94a3b8;--border:#243149;--blue:#3b82f6;--green:#22c55e;--red:#f87171;--chip:#16213a;--chip-border:#334155;--input:#16213a;--shadow:none}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;height:100dvh;background:var(--bg);transition:.2s}
#sidebar{width:390px;padding:16px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border)}#map{flex:1}
h1{font-size:21px;margin:0 0 12px}button,.chip,select,input{font-family:inherit}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#find{flex:1;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
#find:disabled{background:#94a3b8;box-shadow:none;cursor:wait}
#theme{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--chip);color:var(--text);font-size:18px;cursor:pointer}
.search{display:flex;gap:8px;margin-bottom:10px}.search input{flex:1;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--input);color:var(--text)}.search input::placeholder{color:var(--muted)}
.controls{display:flex;gap:8px;margin-bottom:10px}.controls select{flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--chip-border);background:var(--chip);color:var(--text);font-size:13px;cursor:pointer;user-select:none}.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.toggles{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
#status{font-size:14px;color:var(--muted);margin:8px 0}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.item{background:var(--chip);border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:.15s}.item:hover{border-color:var(--blue)}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.item b{font-size:15px;line-height:1.25}
.fav{border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}.fav.on{color:#f59e0b}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700}
.open{background:rgba(22,163,74,.15);color:var(--green)}.closed{background:rgba(239,68,68,.15);color:var(--red)}.unknown{background:rgba(100,116,139,.15);color:var(--muted)}
.links{display:flex;gap:10px;margin-top:7px;align-items:center;flex-wrap:wrap}.links a,.timebtn{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.timeval{font-size:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
@media(max-width:820px){body{flex-direction:column}#sidebar{width:100%;height:50dvh;border-right:0;border-bottom:1px solid var(--border)}#map{height:50dvh}}
</style>
</head>
<body>
<div id="sidebar">
<h1>Что рядом?</h1>
<div class="topbar"><button id="find">Найти рядом</button><button id="theme" title="Тёмная тема">🌙</button></div>
<div class="search"><input id="q" placeholder="Поиск: название, тип, адрес…" autocomplete="off"></div>
<div class="controls">
<select id="radius"><option value="500">Радиус: 500 м</option><option value="1000">Радиус: 1 км</option><option value="1500" selected>Радиус: 1,5 км</option><option value="3000">Радиус: 3 км</option><option value="5000">Радиус: 5 км</option></select>
<select id="mode"><option value="foot">Пешком</option><option value="bike">На велосипеде</option><option value="car">На машине</option></select>
</div>
<div class="filters">
<div class="chip active" data-type="shop">Магазины</div><div class="chip active" data-type="metro">Метро</div>
<div class="chip" data-shop="supermarket">Продукты</div><div class="chip" data-shop="convenience">Мини-маркеты</div><div class="chip" data-shop="pharmacy">Аптеки</div><div class="chip" data-shop="cafe">Кафе</div><div class="chip" data-shop="bakery">Пекарни</div>
</div>
<div class="toggles"><label><input type="checkbox" id="onlyOpen"> Открыто сейчас</label><label><input type="checkbox" id="onlyFav"> Избранное</label></div>
<div id="status">Нажмите «Найти рядом».</div>
<div class="legend"><span><span class="dot" style="background:var(--green)"></span>Магазины</span><span><span class="dot" style="background:var(--blue)"></span>Метро</span><span><span class="dot" style="background:var(--red)"></span>Вы</span></div>
<div id="results"><div class="empty">Здесь появятся ближайшие места.</div></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([60.1699,24.9384],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
const shopLayer=L.layerGroup().addTo(map),metroLayer=L.layerGroup().addTo(map),userLayer=L.layerGroup().addTo(map);
let userPos=null,allPlaces=[],markers=new Map(),activeTypes=new Set(['shop','metro']),activeShopKinds=new Set(),travelQueue=[],travelRunning=false;
let favorites=new Set(JSON.parse(localStorage.getItem('nearby_favorites')||'[]'));
let dark=localStorage.getItem('nearby_theme')==='dark';
const results=document.getElementById('results'),status=document.getElementById('status'),findBtn=document.getElementById('find'),q=document.getElementById('q'),onlyOpen=document.getElementById('onlyOpen'),onlyFav=document.getElementById('onlyFav'),radius=document.getElementById('radius'),mode=document.getElementById('mode'),themeBtn=document.getElementById('theme');
function applyTheme(){document.body.classList.toggle('dark',dark);themeBtn.textContent=dark?'☀️':'🌙';localStorage.setItem('nearby_theme',dark?'dark':'light')}
applyTheme();themeBtn.onclick=()=>{dark=!dark;applyTheme()};
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('active');if(c.dataset.type){c.classList.contains('active')?activeTypes.add(c.dataset.type):activeTypes.delete(c.dataset.type)}else{const k=c.dataset.shop;c.classList.contains('active')?activeShopKinds.add(k):activeShopKinds.delete(k)}render()}));
[q,onlyOpen,onlyFav].forEach(el=>el.addEventListener('input',render));
radius.addEventListener('change',()=>{if(userPos)load(userPos[0],userPos[1])});
mode.addEventListener('change',()=>{travelQueue=[];document.querySelectorAll('.timeval').forEach(el=>el.textContent='—');document.querySelectorAll('.timebtn').forEach(b=>b.style.display='inline')});
function saveFavs(){localStorage.setItem('nearby_favorites',JSON.stringify([...favorites]))}
function meters(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dLat=r(c-a),dLon=r(d-b),x=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function query(lat,lon,r){return `[out:json][timeout:30];(nwr["shop"](around:${r},${lat},${lon});nwr["railway"="station"]["station"="subway"](around:${r},${lat},${lon});nwr["railway"="station"]["subway"="yes"](around:${r},${lat},${lon}););out center;`}
async function load(lat,lon){
 const r=Number(radius.value);findBtn.disabled=true;status.textContent='Ищем магазины и метро…';results.innerHTML='<div class="empty">Загрузка…</div>';
 shopLayer.clearLayers();metroLayer.clearLayers();userLayer.clearLayers();
 L.circleMarker([lat,lon],{radius:8,color:'#ef4444',fillColor:'#ef4444',fillOpacity:.9}).addTo(userLayer);
 L.circle([lat,lon],{radius:r,color:'#2563eb',weight:1,fillOpacity:.05}).addTo(userLayer);
 try{
  const res=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query(lat,lon,r)));
  if(!res.ok)throw 0;const data=await res.json();
  allPlaces=data.elements.filter(e=>e.lat||e.center).map(e=>{const la=e.lat??e.center.lat,lo=e.lon??e.center.lon,t=e.tags||{};return{id:e.id,name:t.name||t.operator||'Без названия',shop:t.shop||null,type:t.shop?'shop':'metro',lat:la,lon:lo,distance:meters(lat,lon,la,lo),hours:t.opening_hours||'',address:[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(', '),phone:t.phone||t['contact:phone']||'',website:t.website||t['contact:website']||''}}).sort((a,b)=>a.distance-b.distance);
  render();
 }catch(e){status.textContent='Не удалось загрузить данные. Попробуйте ещё раз.';results.innerHTML='<div class="empty">Ошибка загрузки.</div>'}
 findBtn.disabled=false;
}
function isOpen(hours){if(!hours)return'unknown';try{const now=new Date(),day=(now.getDay()+6)%7,mins=now.getHours()*60+now.getMinutes();for(const part of hours.split(';').map(s=>s.trim())){const m=part.match(/^(?:(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?)?\s*(\d{1,2}:\d{2})-(\d{1,2}:\d{2})$/i);if(!m)continue;if(m[1]){const days=['mo','tu','we','th','fr','sa','su'],range=m[1].toLowerCase().split('-');if(range.length===2){const a=days.indexOf(range[0]),b=days.indexOf(range[1]);if(!((day>=a&&day<=b)||(a>b&&(day>=a||day<=b))))continue}}const[start,end]=m.slice(2).map(x=>{const[h,mi]=x.split(':').map(Number);return h*60+mi});if(start<=mins&&mins<end)return'open'}}catch(e){}return'closed'}
function badge(s){return s==='open'?'<span class="badge open">Открыто</span>':s==='closed'?'<span class="badge closed">Закрыто</span>':'<span class="badge unknown">Часы не указаны</span>'}
function fmt(sec){const m=Math.round(sec/60);return m<60?`${m} мин`:`${Math.floor(m/60)} ч ${m%60} мин`}
async function travelTime(p,el){
 if(!userPos){el.textContent='нет позиции';return}
 el.textContent='…';
 const profile={foot:'foot',bike:'bike',car:'driving'}[mode.value];
 try{
  const url=`https://router.project-osrm.org/route/v1/${profile}/${userPos[1]},${userPos[0]};${p.lon},${p.lat}?overview=false`;
  const r=await fetch(url),d=await r.json();
  if(d.code!=='Ok'||!d.routes?.length)throw 0;
  el.textContent=fmt(d.routes[0].duration)+' · '+(d.routes[0].distance/1000).toFixed(1)+' км';
 }catch(e){el.textContent='нет данных'}
}
function queueTravel(p,el){travelQueue.push([p,el]);pumpTravel()}
async function pumpTravel(){
 if(travelRunning)return;travelRunning=true;
 while(travelQueue.length){const[p,el]=travelQueue.shift();await travelTime(p,el);await new Promise(r=>setTimeout(r,250))}
 travelRunning=false;
}
function render(){
 shopLayer.clearLayers();metroLayer.clearLayers();results.innerHTML='';markers.clear();travelQueue=[];
 const term=q.value.trim().toLowerCase(),r=Number(radius.value);
 let shown=allPlaces.filter(p=>activeTypes.has(p.type)&&(!activeShopKinds.size||p.type!=='shop'||activeShopKinds.has(p.shop)));
 if(term)shown=shown.filter(p=>(p.name+' '+(p.shop||'')+' '+p.address).toLowerCase().includes(term));
 if(onlyOpen.checked)shown=shown.filter(p=>isOpen(p.hours)==='open');
 if(onlyFav.checked)shown=shown.filter(p=>favorites.has(String(p.id)));
 status.textContent=`Радиус ${r>=1000?(r/1000).toLocaleString('ru-RU')+' км':r+' м'} · показано ${shown.length} из ${allPlaces.length}.`;
 if(!shown.length){results.innerHTML='<div class="empty">Ничего не найдено. Попробуйте увеличить радиус или изменить фильтры.</div>';return}
 shown.slice(0,150).forEach((p,index)=>{
  const color=p.type==='shop'?'#16a34a':'#2563eb';
  const icon=L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.45)"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
  const links=[`<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Маршрут</a>`];
  if(p.website)links.push(`<a href="${p.website}" target="_blank" rel="noopener">Сайт</a>`);
  if(p.phone)links.push(`<a href="tel:${p.phone}">Позвонить</a>`);
  const popup=`<b>${p.name}</b><br>${p.type==='shop'?(p.shop||'Магазин'):'Метро'}<br>${Math.round(p.distance)} м${p.hours?`<br>${p.hours}`:''}${p.address?`<br>${p.address}`:''}<br>${links.join(' ')}`;
  const marker=L.marker([p.lat,p.lon],{icon}).bindPopup(popup).addTo(p.type==='shop'?shopLayer:metroLayer);
  markers.set(String(p.id),marker);
  const div=document.createElement('div');div.className='item';div.dataset.id=p.id;
  const state=isOpen(p.hours);
  div.innerHTML=`<div class="top"><b>${p.name}</b><button class="fav ${favorites.has(String(p.id))?'on':''}" title="В избранное">★</button></div><div class="meta">${p.type==='shop'?(p.shop||'Магазин'):'Метро'} · ${Math.round(p.distance)} м · ${badge(state)}</div>${p.address?`<div class="meta">${p.address}</div>`:''}<div class="links"><button class="timebtn">Время в пути</button><span class="timeval">—</span>${links.join('')}</div>`;
  div.querySelector('.timebtn').onclick=e=>{e.stopPropagation();queueTravel(p,div.querySelector('.timeval'));e.target.style.display='none'};
  div.querySelector('.fav').onclick=e=>{e.stopPropagation();const id=String(p.id);favorites.has(id)?favorites.delete(id):favorites.add(id);saveFavs();e.target.classList.toggle('on');if(onlyFav.checked)render()};
  div.onclick=e=>{if(e.target.tagName!=='A'&&!e.target.classList.contains('fav')&&!e.target.classList.contains('timebtn')){map.setView([p.lat,p.lon],17);marker.openPopup()}};
  results.appendChild(div);
  if(index<20)queueTravel(p,div.querySelector('.timeval'));
 });
}
findBtn.onclick=()=>{
 status.textContent='Определяем местоположение…';
 navigator.geolocation.getCurrentPosition(pos=>{userPos=[pos.coords.latitude,pos.coords.longitude];map.setView(userPos,15);load(userPos[0],userPos[1])},()=>{status.textContent='Разрешите доступ к геолокации или откройте приложение по HTTPS.'},{enableHighAccuracy:true,timeout:10000});
};
</script>
</body>
</html>
