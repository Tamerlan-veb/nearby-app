name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure all four ANDROID signing secrets in repository Settings before building. Missing: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Restore upload key and sign bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          mkdir -p release
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -signedjar release/nearby-release.aab "$bundle" "$KEY_ALIAS"
          jarsigner -verify release/nearby-release.aab
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('release/nearby-release.aab') as bundle:
              assert any(n.upper().startswith('META-INF/') and n.upper().endswith(('.RSA', '.DSA', '.EC')) for n in bundle.namelist()), 'Signature block missing'
          PY
      - name: Upload signed AAB only
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-aab
          path: release/nearby-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
